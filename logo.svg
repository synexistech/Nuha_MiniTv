<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#FFF0F5" stroke="#FFC0CB" stroke-width="3"/>
  
  <!-- TV Body -->
  <rect x="40" y="60" width="120" height="80" rx="12" fill="#FFC0CB" stroke="#FFAFB9" stroke-width="2"/>
  
  <!-- TV Screen -->
  <rect x="55" y="70" width="90" height="50" rx="8" fill="#FFFDF5" stroke="#A39DAE" stroke-width="1"/>
  
  <!-- Baby Face in TV -->
  <circle cx="100" cy="85" r="20" fill="#FFB3BA" stroke="#FF9999" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="95" cy="80" r="3" fill="#352F44"/>
  <circle cx="105" cy="80" r="3" fill="#352F44"/>
  
  <!-- Smile -->
  <path d="M 95 90 Q 100 95 105 90" stroke="#352F44" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- TV Antenna -->
  <line x1="100" y1="60" x2="85" y2="45" stroke="#FFAFB9" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="60" x2="115" y2="45" stroke="#FFAFB9" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Antenna Balls -->
  <circle cx="85" cy="45" r="4" fill="#A2D2FF"/>
  <circle cx="115" cy="45" r="4" fill="#A2D2FF"/>
  
  <!-- Play Button -->
  <circle cx="100" cy="140" r="15" fill="#B5EAD7" stroke="#9DD4C7" stroke-width="2"/>
  <polygon points="95,133 105,140 95,147" fill="#352F44"/>
  
  <!-- Sparkles -->
  <g opacity="0.7">
    <circle cx="65" cy="50" r="2" fill="#FDFD96"/>
    <circle cx="140" cy="55" r="2" fill="#FDFD96"/>
    <circle cx="60" cy="120" r="2" fill="#C7CEEA"/>
    <circle cx="145" cy="110" r="2" fill="#C7CEEA"/>
    <circle cx="170" cy="80" r="1.5" fill="#B5EAD7"/>
    <circle cx="35" cy="90" r="1.5" fill="#B5EAD7"/>
  </g>
  
  <!-- App Name -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#5C5470">Nuha's Mini TV</text>
</svg>